# 로컬 미리보기 서버 (http://127.0.0.1:8080). 처음 한 번 dev/preview/setup.sh 를 실행한다.
name: sspreview
services:
  db:
    image: postgres:14-alpine
    environment: ['POSTGRES_HOST_AUTH_METHOD=trust']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  web:
    image: ssmastodon:local
    env_file: .env.production
    command: bundle exec puma -C config/puma.rb
    depends_on: [db, redis]
    volumes: [system:/mastodon/public/system, ./override/production.rb:/opt/mastodon/config/environments/production.rb:ro, ./override/1_hosts.rb:/opt/mastodon/config/initializers/1_hosts.rb:ro]
  sidekiq:
    image: ssmastodon:local
    env_file: .env.production
    command: bundle exec sidekiq
    depends_on: [db, redis]
    volumes: [system:/mastodon/public/system, ./override/production.rb:/opt/mastodon/config/environments/production.rb:ro, ./override/1_hosts.rb:/opt/mastodon/config/initializers/1_hosts.rb:ro]
  streaming:
    image: ssmastodon-streaming:local
    env_file: .env.production
    command: node ./streaming/index.js
    depends_on: [db, redis]
  proxy:
    image: caddy:2-alpine
    ports: ['127.0.0.1:8080:8080']
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    depends_on: [web]
volumes:
  pgdata:
  system:
