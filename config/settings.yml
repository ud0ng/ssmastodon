# This file contains default values, and does not need to be edited. All
# important settings can be changed from the admin interface.

defaults: &defaults
  site_title: Mastodon
  site_short_description: ''
  site_description: ''
  site_extended_description: ''
  site_terms: ''
  site_contact_username: ''
  site_contact_email: ''
  registrations_mode: 'none'
  status_max_characters: 1000
  status_search_enabled: false
  status_search_scope: following
  community_theme_enabled: false
  community_theme_main_light: ''
  community_theme_point_light: ''
  community_theme_main_dark: ''
  community_theme_point_dark: ''
  community_theme_post_button_main: false
  community_theme_default: light
  community_theme_page_light: ''
  community_theme_box_light: ''
  community_theme_compose_light: ''
  community_theme_selected_light: ''
  community_theme_border_light: ''
  community_theme_text_light: ''
  community_theme_nav_light: ''
  community_theme_dim_light: ''
  community_theme_dim_hover_light: ''
  community_theme_on_point_light: ''
  community_theme_post_button_light: ''
  community_theme_post_button_text_light: ''
  community_theme_box_opacity_light: ''
  community_theme_page_dark: ''
  community_theme_box_dark: ''
  community_theme_compose_dark: ''
  community_theme_selected_dark: ''
  community_theme_border_dark: ''
  community_theme_text_dark: ''
  community_theme_nav_dark: ''
  community_theme_dim_dark: ''
  community_theme_dim_hover_dark: ''
  community_theme_on_point_dark: ''
  community_theme_post_button_dark: ''
  community_theme_post_button_text_dark: ''
  community_theme_box_opacity_dark: ''
  profile_directory: true
  closed_registrations_message: ''
  timeline_preview: true
  show_staff_badge: true
  preview_sensitive_media: false
  noindex: true
  theme: 'mastodon-bird-ui-light'
  trends: true
  trends_as_landing_page: true
  trendable_by_default: false
  reserved_usernames:
    - abuse
    - account
    - accounts
    - admin
    - administration
    - administrator
    - admins
    - help
    - helpdesk
    - instance
    - manager
    - mod
    - moderator
    - moderators
    - mods
    - owner
    - root
    - security
    - server
    - staff
    - support
    - webmaster
  disallowed_hashtags: # space separated string or list of hashtags without the hash
  bootstrap_timeline_accounts: ''
  activity_api_enabled: true
  peers_api_enabled: true
  show_domain_blocks: 'disabled'
  show_domain_blocks_rationale: 'disabled'
  require_invite_text: false
  backups_retention_period: 7
  captcha_enabled: false
  allow_referer_origin: false
  multi_account:
    client_id: <%= ENV.fetch('MA_MULTI_ACCOUNT_CLIENT_ID', '') %>
    client_secret: <%= ENV.fetch('MA_MULTI_ACCOUNT_CLIENT_SECRET', '') %>
    redirect_uri: <%= ENV.fetch('MA_MULTI_ACCOUNT_REDIRECT_URI', '') %>
    retain_tokens: <%= ENV.fetch('MA_MULTI_ACCOUNT_RETAIN_TOKENS', 'true') %>
    refresh_flow: <%= ENV.fetch('MA_MULTI_ACCOUNT_REFRESH_FLOW', 'true') %>
    scopes: <%= ENV.fetch('MA_MULTI_ACCOUNT_SCOPES', 'read write follow push') %>

development:
  <<: *defaults

test:
  <<: *defaults

production:
  <<: *defaults

